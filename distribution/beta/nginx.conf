# Put this file in nginx's http {} include directory (for example conf.d).
# Replace the example domain and certificate paths before enabling it.
map $http_upgrade $zhiyu_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name zhiyu.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name zhiyu.example.com;
    ssl_certificate /etc/letsencrypt/live/zhiyu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiyu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Preserve the real public Host and Origin: the application validates
        # both before authenticating and adapting legacy NPC middleware.
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhiyu_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
